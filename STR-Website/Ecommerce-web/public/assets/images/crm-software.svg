<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg_crm-software" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051E1C" />
      <stop offset="100%" stop-color="#0F3B37" />
    </linearGradient>
    <linearGradient id="accent_crm-software" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="380" fill="url(#bg_crm-software)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="220" x2="600" y2="220" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Graphic Mockup Element -->
  
      <!-- ERP / CRM Analytics Dashboard -->
      <rect x="70" y="75" width="460" height="210" rx="12" fill="#0A1124" stroke="#00B4A6" stroke-width="1.5" />
      <rect x="70" y="75" width="460" height="32" fill="#131D38" />
      <text x="90" y="95" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8">SYSTEM DASHBOARD ANALYTICS</text>
      <!-- Bar chart -->
      <rect x="100" y="210" width="24" height="50" rx="4" fill="#00B4A6" opacity="0.5" />
      <rect x="135" y="180" width="24" height="80" rx="4" fill="#00B4A6" opacity="0.8" />
      <rect x="170" y="145" width="24" height="115" rx="4" fill="#00B4A6" />
      <rect x="205" y="165" width="24" height="95" rx="4" fill="#00B4A6" opacity="0.7" />
      <!-- Metric Cards -->
      <rect x="260" y="125" width="120" height="60" rx="8" fill="#1C284B" stroke="#00B4A6" stroke-opacity="0.4" />
      <rect x="395" y="125" width="120" height="60" rx="8" fill="#1C284B" stroke="#00B4A6" stroke-opacity="0.4" />
      <rect x="260" y="195" width="255" height="65" rx="8" fill="#1C284B" stroke="#00B4A6" stroke-opacity="0.4" />
    

  <!-- Bottom Info Overlay Bar -->
  <rect x="0" y="300" width="600" height="80" fill="rgba(13, 27, 42, 0.95)" />
  <line x1="0" y1="300" x2="600" y2="300" stroke="#00B4A6" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Badge Capsule -->
  <rect x="24" y="318" width="130" height="24" rx="12" fill="#00B4A6" fill-opacity="0.2" stroke="#00B4A6" stroke-opacity="0.5" />
  <text x="89" y="334" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00B4A6" text-anchor="middle" letter-spacing="0.5">AUTOMATION</text>

  <!-- Title & Subtitle in Footer -->
  <text x="170" y="330" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Custom CRM Client</text>
  <text x="170" y="352" font-family="sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Lead Tracking & Sales Pipeline Engine</text>
