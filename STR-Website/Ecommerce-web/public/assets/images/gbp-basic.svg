    <line x1="0" y1="220" x2="600" y2="220" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Graphic Mockup Element -->
  
      <!-- Google Search & Maps Card -->
      <rect x="80" y="75" width="440" height="210" rx="14" fill="#0A1628" stroke="#34A853" stroke-width="1.5" />
      <rect x="100" y="95" width="400" height="34" rx="17" fill="#162A45" stroke="#34A853" stroke-opacity="0.5" />
      <circle cx="120" cy="112" r="6" fill="#34A853" />
      <text x="135" y="116" font-family="sans-serif" font-size="11" fill="#94A3B8">Saampark Certified Local Business Search...</text>
      <!-- Search Ad Result #1 -->
      <rect x="100" y="145" width="32" height="16" rx="4" fill="#F5A623" />
      <text x="106" y="157" font-family="sans-serif" font-size="9" font-weight="bold" fill="#000">Ad</text>
      <rect x="140" y="147" width="220" height="12" rx="3" fill="#34A853" />
      <rect x="100" y="170" width="360" height="14" rx="3" fill="#FFFFFF" />
      <rect x="100" y="192" width="280" height="10" rx="2" fill="#64748B" opacity="0.7" />
      <rect x="100" y="215" width="380" height="50" rx="8" fill="#162A45" />
    

  <!-- Bottom Info Overlay Bar -->
  <rect x="0" y="300" width="600" height="80" fill="rgba(13, 27, 42, 0.95)" />
  <line x1="0" y1="300" x2="600" y2="300" stroke="#34A853" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Badge Capsule -->
