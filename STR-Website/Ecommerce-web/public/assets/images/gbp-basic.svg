<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg_gbp-basic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061E10" />
      <stop offset="100%" stop-color="#0F3D22" />
    </linearGradient>
    <linearGradient id="accent_gbp-basic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="380" fill="url(#bg_gbp-basic)" />

  <!-- Background Grid Pattern -->
