<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg_school-system" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190B28" />
      <stop offset="100%" stop-color="#3B1559" />
    </linearGradient>
    <linearGradient id="accent_school-system" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="380" fill="url(#bg_school-system)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="220" x2="600" y2="220" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Graphic Mockup Element -->
  
      <rect x="90" y="75" width="420" height="210" rx="14" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5" />
      <circle cx="300" cy="150" r="38" fill="#8B5CF6" opacity="0.25" stroke="#8B5CF6" stroke-width="2" />
      <rect x="140" y="210" width="320" height="16" rx="4" fill="#FFFFFF" />
      <rect x="180" y="238" width="240" height="12" rx="3" fill="#8B5CF6" />
      <rect x="210" y="260" width="180" height="10" rx="2" fill="#64748B" opacity="0.6" />
    

  <!-- Bottom Info Overlay Bar -->
  <rect x="0" y="300" width="600" height="80" fill="rgba(13, 27, 42, 0.95)" />
  <line x1="0" y1="300" x2="600" y2="300" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Badge Capsule -->
  <rect x="24" y="318" width="130" height="24" rx="12" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-opacity="0.5" />
  <text x="89" y="334" font-family="sans-serif" font-size="10" font-weight="bold" fill="#8B5CF6" text-anchor="middle" letter-spacing="0.5">EDUCATION</text>

  <!-- Title & Subtitle in Footer -->
  <text x="170" y="330" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">School Management</text>
  <text x="170" y="352" font-family="sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Student Portal, Fees & Attendance</text>
